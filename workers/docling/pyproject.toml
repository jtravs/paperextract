[project]
name = "paperextract-trial-docling"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "docling==2.129.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
