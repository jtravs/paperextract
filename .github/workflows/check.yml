name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync poe check
      - run: uv build
      - name: Check wheel outside the checkout
        shell: bash
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/paperextract-wheel"
          uv pip install --python "$RUNNER_TEMP/paperextract-wheel/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/paperextract-wheel/bin/python" -I -c 'from importlib.metadata import metadata; import paperextract; assert metadata("paperextract")["License-Expression"] == "Apache-2.0"'
